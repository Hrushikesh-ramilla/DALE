<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img"><title>DALE action lifecycle</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#73736e"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f5f5f0"/><g font-family="Arial,Helvetica,sans-serif" fill="#161616"><text x="55" y="51" font-size="16" fill="#64645e" letter-spacing="3">02  /  ACTION LIFECYCLE</text><text x="55" y="103" font-size="36" fill="#171717" font-family="Georgia,serif">An action is complete when its effect is observed.</text><rect x="55" y="150" width="280" height="148" rx="12" fill="#fff" stroke="#d3d3cb"/><text x="80" y="184" font-size="15" fill="#777771" letter-spacing="2">01</text><text x="80" y="222" font-size="25" fill="#171717" font-weight="600">Intent</text><text x="80" y="258" font-size="20" fill="#555550" >Customer asks for a task.</text><path d="M342 225 L379 225" stroke="#90908a" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="391" y="150" width="280" height="148" rx="12" fill="#fff" stroke="#d3d3cb"/><text x="416" y="184" font-size="15" fill="#777771" letter-spacing="2">02</text><text x="416" y="222" font-size="25" fill="#171717" font-weight="600">Resolve</text><text x="416" y="258" font-size="20" fill="#555550" >Read IDs, facts and state.</text><path d="M678 225 L715 225" stroke="#90908a" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="727" y="150" width="280" height="148" rx="12" fill="#171717" stroke="#171717"/><text x="752" y="184" font-size="15" fill="#bcbcb6" letter-spacing="2">03</text><text x="752" y="222" font-size="25" fill="#fff" font-weight="600">Execute</text><text x="752" y="258" font-size="20" fill="#d2d2ca" ><tspan x="752">Validate the operation.</tspan><tspan x="752" dy="25">Approve where required.</tspan></text><path d="M1014 225 L1051 225" stroke="#90908a" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="1063" y="150" width="280" height="148" rx="12" fill="#fff" stroke="#d3d3cb"/><text x="1088" y="184" font-size="15" fill="#777771" letter-spacing="2">04</text><text x="1088" y="222" font-size="25" fill="#171717" font-weight="600">Observe</text><text x="1088" y="258" font-size="20" fill="#555550" >Persist effect and receipt.</text><text x="55" y="333" font-size="18" fill="#555550" >Interrupted tasks preserve committed effects; replay protection prevents duplicate writes.</text></g></svg>