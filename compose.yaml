services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: buyerguard
      POSTGRES_USER: buyerguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyerguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    image: buyerguard:local
    env_file: ${BUYERGUARD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://buyerguard:${POSTGRES_PASSWORD}@database:5432/buyerguard
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to at least 32 characters}
      OPERATOR_ACCESS_CODE: ${OPERATOR_ACCESS_CODE:?Set a private operator code}
      LOCAL_DATA_DIR: /data
      STORAGE_MODE: local
      ALLOW_LOCAL_STORAGE: "true"
      BUILD_ID: ${BUILD_ID:-development}
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["evidence:/data"]
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: buyerguard:local
    command: ["node", "worker.cjs"]
    env_file: ${BUYERGUARD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://buyerguard:${POSTGRES_PASSWORD}@database:5432/buyerguard
      LOCAL_DATA_DIR: /data
      STORAGE_MODE: local
      ALLOW_LOCAL_STORAGE: "true"
    volumes: ["evidence:/data"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  evidence:
